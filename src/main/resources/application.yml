server:
  # Render and Railway pass the port in $PORT; 8080 when running locally
  port: ${PORT:8080}
  # Trust the hosting proxy's X-Forwarded-* headers so generated URLs (e.g. Swagger's server) use https
  forward-headers-strategy: framework

spring:
  application:
    name: quote-guardrail-api
  datasource:
    url: jdbc:h2:mem:guardrail;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop        # build tables from the @Entity classes at startup
    open-in-view: false
    defer-datasource-initialization: true   # run data.sql after the tables exist
  sql:
    init:
      mode: always
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    operations-sorter: method
    try-it-out-enabled: true

# Sites allowed to call the API from a browser (see CorsConfig.java)
app:
  cors:
    allowed-origins: https://jamesboggs.online,https://www.jamesboggs.online,https://*.vercel.app,http://localhost:*

# Pricing policy (see GuardrailPolicy.java)
guardrail:
  margin-floor-pct: 28.0
  hard-floor-pct: 22.0
  discount-cap-pct:
    STANDARD: 10.0
    PREFERRED: 15.0
    KEY: 20.0
